<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Color Theory</title>
        <meta charset="UTF-8">
    </head>
<style>
    .box1{
        width: 400px;
        height: 400px;
        background-color: blueviolet;
        border-radius: 20px;
        border: solid 30px #f8f400
    }
    .box2{
        width: 400px;
        height: 400px;
        background-color: rgb(255, 7, 7);
        border-radius: 20px;
        border: solid 30px #f89500
    }
    .box3{
        width: 400px;
        height: 400px;
        background-color: rgb(25, 0, 255);
        border-radius: 20px;
        border: solid 30px #f80000;
        color:#f8f400
    }

</style>

    

<body>
    <div class = "box1">
        <h1>Complementary</h1>
    </div>
    
    <div class ="box2">
        <h1>Analogous</h1>
    </div>

    <div class="box3">
        <h1>Triadic</h1>
    </div>
</body>
</html>
